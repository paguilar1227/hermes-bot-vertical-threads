name: Check plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code -- desktop/plugin.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser && npm run test:plugin
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: NousResearch/hermes-agent/.github/actions/plugin-validate@0c298828c5b5cf9c03b41e35d92a282eaa8c2df7
        with:
          path: .
          hermes-ref: 0c298828c5b5cf9c03b41e35d92a282eaa8c2df7
